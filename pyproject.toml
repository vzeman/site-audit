[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "site-audit"
version = "0.1.0"
description = "Crawl any website, embed its pages, surface duplicates and outliers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Viktor Zeman" }]
keywords = ["seo", "audit", "embeddings", "crawler", "duplicates"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  "requests>=2.31.0",
  "beautifulsoup4>=4.12.0",
  "lxml>=4.9.0",
  "trafilatura>=1.12.0",
  "numpy>=1.24.0",
  "sentence-transformers>=2.6.0",
  "faiss-cpu>=1.7.4",
  "umap-learn>=0.5.5",
]

[project.urls]
Homepage = "https://github.com/vzeman/site-audit"
Source   = "https://github.com/vzeman/site-audit"
Issues   = "https://github.com/vzeman/site-audit/issues"

[project.scripts]
site-audit = "site_audit.cli:main"

[tool.setuptools.packages.find]
include = ["site_audit*"]

[tool.setuptools.package-data]
site_audit = ["py.typed"]
