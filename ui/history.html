<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>site-audit history</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900">
  <div class="max-w-screen-2xl mx-auto p-6">
    <header class="mb-6">
      <h1 class="text-3xl font-bold">Historical change impact</h1>
      <p class="text-gray-600 text-sm mt-1" id="history-meta">...</p>
    </header>

    <section class="bg-white border border-gray-200 rounded-lg shadow-sm p-5 mb-8">
      <h2 class="text-xl font-semibold mb-3">Snapshot summary</h2>
      <div id="history-summary" class="grid sm:grid-cols-2 lg:grid-cols-4 xl:grid-cols-8 gap-3 text-sm mb-5"></div>
      <div id="history-caveats" class="text-xs bg-amber-50 text-amber-900 border border-amber-200 rounded p-3"></div>
    </section>

    <section class="bg-white border border-gray-200 rounded-lg shadow-sm p-5 mb-8">
      <h2 class="text-xl font-semibold mb-3">Historical trends</h2>
      <div id="history-metric-trends" class="grid md:grid-cols-2 xl:grid-cols-4 gap-4 mb-5"></div>
      <h3 class="text-sm font-semibold text-gray-700 mb-2">Major tracked changes</h3>
      <div id="history-change-trends" class="w-full" style="min-height:260px;"></div>
    </section>

    <section class="bg-white border border-gray-200 rounded-lg shadow-sm p-5 mb-8">
      <div class="flex items-center justify-between gap-3 flex-wrap mb-3">
        <div>
          <h2 class="text-xl font-semibold">Before/after impact table</h2>
          <p class="text-xs text-gray-500 mt-1">Associations with dates and metric deltas. These are validation clues, not causal proof.</p>
        </div>
        <input id="history-search" type="search" placeholder="Search URL, title, field, keyword..."
          class="rounded border border-gray-300 px-3 py-1.5 text-sm min-w-[280px]">
      </div>
      <div class="overflow-x-auto">
        <table class="min-w-full text-xs" id="history-impact-table">
          <thead class="bg-gray-100 text-gray-600 uppercase"></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <section class="bg-white border border-gray-200 rounded-lg shadow-sm p-5 mb-8">
      <h2 class="text-xl font-semibold mb-3">Changed paragraphs, links, schema, metadata</h2>
      <div class="overflow-x-auto">
        <table class="min-w-full text-xs" id="history-change-table">
          <thead class="bg-gray-100 text-gray-600 uppercase"></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </div>

<script type="application/json" id="data-history">__HISTORY_JSON__</script>
<script>
(function(){
  const escapeHtml = s => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  const el = document.getElementById('data-history');
  const raw = el ? el.textContent.trim() : '';
  const data = raw && !raw.startsWith('__') ? JSON.parse(raw) : null;
  if (!data) {
    document.body.insertAdjacentHTML('beforeend', '<div class="p-6 text-red-700">No history data.</div>');
    return;
  }
  const summary = data.summary || {};
  const windowText = summary.window_days ? ` · ${summary.window_days}d window` : '';
  document.getElementById('history-meta').textContent =
    `${summary.domain || ''} · ${summary.before || ''} to ${summary.after || ''} · ${summary.before_date || ''} -> ${summary.after_date || ''}${windowText}`;
  function card(label, value, hint) {
    return `<div class="border border-gray-200 rounded p-3 bg-white"><div class="text-2xl font-semibold">${escapeHtml(value)}</div><div class="text-xs text-gray-500">${escapeHtml(label)}</div>${hint ? `<div class="text-xs text-gray-400 mt-0.5">${escapeHtml(hint)}</div>` : ''}</div>`;
  }
  document.getElementById('history-summary').innerHTML =
    card('Pages before', Number(summary.pages_before || 0).toLocaleString(), '') +
    card('Pages after', Number(summary.pages_after || 0).toLocaleString(), '') +
    card('Changed', Number(summary.changed_pages || 0).toLocaleString(), 'tracked fields') +
    card('Added', Number(summary.added_pages || 0).toLocaleString(), 'new URLs') +
    card('Removed', Number(summary.removed_pages || 0).toLocaleString(), 'missing URLs') +
    card('Traffic delta', Number(summary.traffic_delta || 0).toLocaleString(), `${Number(summary.traffic_before || 0).toLocaleString()} -> ${Number(summary.traffic_after || 0).toLocaleString()}`) +
    card('Clicks delta', Number(summary.clicks_delta || 0).toLocaleString(), `${Number(summary.clicks_before || 0).toLocaleString()} -> ${Number(summary.clicks_after || 0).toLocaleString()}`) +
    card('Avg rank delta', summary.avg_position_delta == null ? '' : Number(summary.avg_position_delta || 0).toLocaleString(), `${Number(summary.avg_position_before || 0).toLocaleString()} -> ${Number(summary.avg_position_after || 0).toLocaleString()}`);
  document.getElementById('history-caveats').innerHTML = (summary.caveats || []).map(c => `<div>${escapeHtml(c)}</div>`).join('');

  function drawOneMetric(container, rows, spec) {
    const values = rows.map(r => Number(r[spec.key] || 0));
    const extent = d3.extent(values);
    const min = extent[0] === extent[1] ? Math.max(0, extent[0] - 1) : extent[0];
    const max = extent[0] === extent[1] ? extent[1] + 1 : extent[1];
    const margin = {top: 16, right: 12, bottom: 34, left: 44};
    const width = Math.max(250, container.clientWidth || 320) - margin.left - margin.right;
    const height = 180 - margin.top - margin.bottom;
    const svg = d3.select(container).append('svg').attr('width', width + margin.left + margin.right).attr('height', 180)
      .append('g').attr('transform', `translate(${margin.left},${margin.top})`);
    const x = d3.scalePoint().domain(rows.map(r => r.snapshot_id)).range([0, width]).padding(0.45);
    const y = d3.scaleLinear().domain([min, max]).nice().range([height, 0]);
    svg.append('g').attr('transform', `translate(0,${height})`).call(d3.axisBottom(x).tickSizeOuter(0));
    svg.append('g').call(d3.axisLeft(y).ticks(4));
    svg.append('path').datum(rows).attr('fill','none').attr('stroke', spec.color).attr('stroke-width',2)
      .attr('d', d3.line().x(r => x(r.snapshot_id)).y(r => y(Number(r[spec.key] || 0))));
    svg.selectAll('circle').data(rows).join('circle')
      .attr('cx', r => x(r.snapshot_id)).attr('cy', r => y(Number(r[spec.key] || 0))).attr('r', 4).attr('fill', spec.color);
  }

  function drawMetricTrends() {
    const container = document.getElementById('history-metric-trends');
    const rows = data.timeline || [];
    container.innerHTML = '';
    if (!rows.length) return;
    const specs = [
      {key: 'traffic', label: 'Traffic', color: '#2563eb'},
      {key: 'clicks', label: 'Clicks', color: '#16a34a'},
      {key: 'impressions', label: 'Impressions', color: '#7c3aed'},
      {key: 'avg_position', label: 'Avg rank', color: '#ea580c'},
    ];
    specs.forEach(spec => {
      const panel = document.createElement('div');
      panel.className = 'border border-gray-200 rounded p-3 bg-white';
      panel.innerHTML = `<div class="text-sm font-semibold mb-1">${escapeHtml(spec.label)}</div><div class="history-chart"></div>`;
      container.appendChild(panel);
      drawOneMetric(panel.querySelector('.history-chart'), rows, spec);
    });
  }

  function drawChangeTrends() {
    const container = document.getElementById('history-change-trends');
    const rows = data.timeline || [];
    const latest = rows[rows.length - 1] || {};
    container.innerHTML = '';
    const bars = [
      {label: 'Pages', value: Number(latest.changed_pages || 0), color: '#2563eb'},
      {label: 'Content', value: Number(latest.content_changes || 0), color: '#16a34a'},
      {label: 'Paragraphs', value: Number(latest.paragraph_changes || 0), color: '#7c3aed'},
      {label: 'Links', value: Number(latest.link_changes || 0), color: '#ea580c'},
      {label: 'Schema', value: Number(latest.schema_changes || 0), color: '#0891b2'},
    ];
    const margin = {top: 12, right: 24, bottom: 42, left: 72};
    const width = Math.max(520, container.offsetWidth || 900) - margin.left - margin.right;
    const height = 260 - margin.top - margin.bottom;
    const svg = d3.select(container).append('svg').attr('width', width + margin.left + margin.right).attr('height', 260)
      .append('g').attr('transform', `translate(${margin.left},${margin.top})`);
    const x = d3.scaleBand().domain(bars.map(d => d.label)).range([0, width]).padding(0.25);
    const y = d3.scaleLinear().domain([0, d3.max(bars, d => d.value) || 1]).nice().range([height, 0]);
    svg.append('g').attr('transform', `translate(0,${height})`).call(d3.axisBottom(x));
    svg.append('g').call(d3.axisLeft(y).ticks(5));
    svg.selectAll('rect').data(bars).join('rect')
      .attr('x', d => x(d.label)).attr('y', d => y(d.value)).attr('width', x.bandwidth()).attr('height', d => height - y(d.value))
      .attr('fill', d => d.color).attr('rx', 3);
    svg.selectAll('text.value').data(bars).join('text')
      .attr('class', 'value').attr('x', d => x(d.label) + x.bandwidth() / 2).attr('y', d => y(d.value) - 5)
      .attr('text-anchor', 'middle').attr('font-size', 11).attr('fill', '#374151').text(d => d.value.toLocaleString());
  }

  function searchText(row) {
    return JSON.stringify(row || {}).toLowerCase();
  }
  function filtered(rows) {
    const q = (document.getElementById('history-search').value || '').trim().toLowerCase();
    return q ? rows.filter(row => searchText(row).includes(q)) : rows;
  }
  function renderTables() {
    const impact = filtered(data.impact_table || []);
    const impactTbl = document.getElementById('history-impact-table');
    impactTbl.querySelector('thead').innerHTML = `<tr>
      <th class="px-2 py-2 text-left">Page</th><th class="px-2 py-2 text-left">Changed</th><th class="px-2 py-2 text-right">Traffic</th>
      <th class="px-2 py-2 text-right">Clicks</th><th class="px-2 py-2 text-right">Impr.</th><th class="px-2 py-2 text-right">Rank</th>
      <th class="px-2 py-2 text-left">Confidence</th><th class="px-2 py-2 text-left">Caveat</th>
    </tr>`;
    impactTbl.querySelector('tbody').innerHTML = impact.slice(0, 200).map(r => `
      <tr class="border-b border-gray-100 align-top">
        <td class="px-2 py-1.5"><a class="text-blue-600 hover:underline" href="${escapeHtml(r.url || '#')}" target="_blank" rel="noopener">${escapeHtml(r.title_after || r.title_before || r.url || '')}</a><div class="text-gray-500">${escapeHtml(r.top_keyword || '')}</div></td>
        <td class="px-2 py-1.5">${escapeHtml((r.changed_fields || []).join(', ') || r.status || '')}</td>
        <td class="px-2 py-1.5 text-right font-mono">${Number(r.traffic_before || 0).toLocaleString()} -> ${Number(r.traffic_after || 0).toLocaleString()}<div class="${Number(r.traffic_delta || 0) >= 0 ? 'text-green-700' : 'text-red-700'}">${Number(r.traffic_delta || 0).toLocaleString()}</div></td>
        <td class="px-2 py-1.5 text-right font-mono">${Number(r.clicks_before || 0).toLocaleString()} -> ${Number(r.clicks_after || 0).toLocaleString()}<div class="${Number(r.clicks_delta || 0) >= 0 ? 'text-green-700' : 'text-red-700'}">${Number(r.clicks_delta || 0).toLocaleString()}</div></td>
        <td class="px-2 py-1.5 text-right font-mono">${Number(r.impressions_delta || 0).toLocaleString()}</td>
        <td class="px-2 py-1.5 text-right font-mono">${r.position_delta == null ? '' : Number(r.position_delta || 0).toLocaleString()}</td>
        <td class="px-2 py-1.5">${escapeHtml(r.confidence || '')}</td>
        <td class="px-2 py-1.5 text-gray-600">${escapeHtml(r.impact_caveat || '')}</td>
      </tr>`).join('') || '<tr><td class="px-2 py-8 text-center text-gray-500" colspan="8">No impact rows.</td></tr>';

    const changes = filtered(data.changes || []);
    const changeTbl = document.getElementById('history-change-table');
    changeTbl.querySelector('thead').innerHTML = `<tr>
      <th class="px-2 py-2 text-left">Page</th><th class="px-2 py-2 text-left">Status</th><th class="px-2 py-2 text-right">Paragraphs</th>
      <th class="px-2 py-2 text-right">Links</th><th class="px-2 py-2 text-left">Schema</th><th class="px-2 py-2 text-left">Freshness</th>
    </tr>`;
    changeTbl.querySelector('tbody').innerHTML = changes.slice(0, 300).map(r => `
      <tr class="border-b border-gray-100 align-top">
        <td class="px-2 py-1.5"><a class="text-blue-600 hover:underline" href="${escapeHtml(r.url || '#')}" target="_blank" rel="noopener">${escapeHtml(r.title_after || r.title_before || r.url || '')}</a><div class="text-gray-500">${escapeHtml((r.changed_fields || []).join(', '))}</div></td>
        <td class="px-2 py-1.5">${escapeHtml(r.status || '')}</td>
        <td class="px-2 py-1.5 text-right font-mono">+${Number(r.paragraphs_added || 0).toLocaleString()} / -${Number(r.paragraphs_removed || 0).toLocaleString()}</td>
        <td class="px-2 py-1.5 text-right font-mono">+${Number(r.links_added || 0).toLocaleString()} / -${Number(r.links_removed || 0).toLocaleString()}</td>
        <td class="px-2 py-1.5">${escapeHtml([...(r.schema_added || []), ...(r.schema_removed || [])].join(' / '))}</td>
        <td class="px-2 py-1.5">${escapeHtml(((r.freshness_before || {}).bucket || '') + ' -> ' + ((r.freshness_after || {}).bucket || ''))}</td>
      </tr>`).join('') || '<tr><td class="px-2 py-8 text-center text-gray-500" colspan="6">No changed rows.</td></tr>';
  }
  document.getElementById('history-search').addEventListener('input', renderTables);
  drawMetricTrends();
  drawChangeTrends();
  renderTables();
})();
</script>
</body>
</html>
